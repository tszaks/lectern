<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectern · Presenter</title>
<style>
  /* Black, white and gray, with one orange accent. */
  :root { --bg: #ffffff; --side: #f7f7f8; --panel: #ffffff; --line: #e7e7e9; --text: #111111; --muted: #8a8a8f;
    --accent: #f26b1d; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button:hover { background: var(--side); }
  button.primary { background: #111; border-color: #111; color: #fff; font-weight: 600; }
  button.primary:hover { background: #333; }
  button:disabled, button:disabled:hover { opacity: .35; cursor: default; background: var(--panel); }
  button.primary:disabled { background: #111; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; }
  /* In the Mac app there is no title bar: the window buttons sit at the left of this bar. */
  .mac-app header { min-height: 60px; padding: 0 20px 0 92px; }
  #home { color: var(--muted); text-decoration: none; font-size: 18px; }
  #home:hover { color: var(--text); }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  header > * { flex-shrink: 0; }
  header > #title { flex-shrink: 1; }
  @media (max-width: 960px) { #clock, #status { display: none; } }
  /* SF Pro Rounded, Heavy: the same font Vero and Payday use for balances. */
  #timer { font: 800 24px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; cursor: pointer; min-width: 90px; text-align: right; color: var(--accent); }
  #timer.paused { color: var(--muted); }
  /* Rolling digits, like Apple's number animation in Vero and Payday: a changed digit slides up and out,
     and the new one rolls in from below. */
  #timer .slot { display: inline-block; position: relative; overflow: hidden; vertical-align: top; height: 1.25em; line-height: 1.25em; }
  #timer .d { display: inline-block; transition: transform .42s cubic-bezier(.2, .9, .25, 1), opacity .3s ease, filter .3s ease; }
  #timer .d.enter { transform: translateY(70%); opacity: 0; filter: blur(2px); }
  #timer .d.leave { position: absolute; left: 0; top: 0; transform: translateY(-70%); opacity: 0; filter: blur(2px); }
  @media (prefers-reduced-motion: reduce) { #timer .d { transition: none; } }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  #status { color: var(--muted); font-size: 13px; }
  #status.warn { color: var(--accent); }
  #resync { display: none; padding: 2px 10px; font-size: 13px; }
  #resync.on { display: inline-block; }
  #blackbadge { display: none; background: #111; color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  body.black #blackbadge { display: inline-block; }

  /* Everything scales with the window, in both directions: each slide is the biggest 16:9 box that fits. */
  main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: clamp(12px, 2vw, 24px); padding: 8px clamp(12px, 1.5vw, 20px) clamp(12px, 1.5vw, 20px); min-height: 0; overflow: hidden; }
  .stage { width: 100%; }
  .left .stage { width: min(100cqw, calc((100cqh - 96px) * 16 / 9)); }
  .right .stage { width: min(100cqw, calc(42cqh * 16 / 9)); }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } .right .next { display: none; } }
  .label { color: var(--muted); font-size: 12px; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .screen { position: relative; aspect-ratio: 16 / 9; width: 100%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  /* Decks always render at 1920x1080 and are scaled to fit, so every view matches the projector. */
  .screen iframe { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0;
    transform: translate(-50%, -50%) scale(var(--fit, .25)); will-change: transform; }
  /* "Next" is a frozen copy of the deck: it looks exactly like the slide, with no animation. */
  #preview { pointer-events: none; }
  #end { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); background: var(--side); }
  #end.on { display: grid; }
  .left { container-type: size; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  #nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
  #count { font-variant-numeric: tabular-nums; min-width: 90px; text-align: center; color: var(--muted); }
  .right { container-type: size; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 24px); min-height: 0; }
  .right .next { display: flex; justify-content: center; }
  .notes { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #notes { flex: 1; width: 100%; resize: none; background: var(--side); color: var(--text); border: 1px solid transparent; border-radius: 12px;
    padding: 16px 18px; font: 26px/1.45 -apple-system, system-ui, sans-serif; outline: none; }
  #notes:focus { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
  #notes::placeholder { color: #b4b4b8; }
  .size { display: flex; gap: 6px; align-items: center; }
  .size button { padding: 2px 10px; font-size: 13px; }
  #saved { font-size: 12px; }

  /* Slide strip along the bottom, like PowerPoint: click to go to a slide, drag to change the order. */
  body.strip { grid-template-rows: auto minmax(0, 1fr) auto; }
  #strip { display: none; border-top: 1px solid var(--line); background: var(--side); }
  body.strip #strip { display: block; }
  #strip .bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px 0; color: var(--muted); font-size: 13px; }
  #strip .bar .grow { flex: 1; }
  #strip .bar button { padding: 3px 12px; font-size: 13px; }
  #strip .bar .pending { display: none; }
  #strip.changed .bar .pending { display: inline-block; }
  #stripframe { display: block; width: 100%; height: clamp(110px, 17vh, 180px); border: 0; }
</style>
</head>
<body class="strip">
<header>
  <a id="home" href="/" title="All decks">←</a>
  <div id="title">Lectern</div>
  <span id="blackbadge">SCREEN BLANK</span>
  <span id="status"></span><button id="resync">Fix</button>
  <button class="primary" id="open">Start presenting</button>
  <span id="clock"></span>
  <span id="timer" class="paused" title="Click to start or pause. Double-click to reset.">0:00</span>
</header>
<main>
  <section class="left">
    <div class="stage">
      <div class="label">Now</div>
      <div class="screen"><iframe id="current" data-role="current" allow="fullscreen; autoplay"></iframe></div>
    </div>
    <div id="nav">
      <button id="prev" aria-label="Previous">←</button>
      <span id="count">–</span>
      <button id="next" aria-label="Next">→</button>
    </div>
  </section>
  <section class="right">
    <div class="next"><div class="stage">
      <div class="label">Next</div>
      <div class="screen"><iframe id="preview" data-role="preview" tabindex="-1"></iframe><div id="end">End of deck</div></div>
    </div></div>
    <div class="notes">
      <div class="label">
        <span>Notes <span id="saved"></span></span>
        <span class="size"><button id="smaller" title="Smaller notes (−)">A−</button><button id="bigger" title="Bigger notes (+)">A+</button></span>
      </div>
      <textarea id="notes" placeholder="No notes for this slide. Type here, or ask your agent to add them." spellcheck="true"></textarea>
    </div>
  </section>
</main>
<section id="strip" aria-label="Slides">
  <div class="bar"><span id="striphint">Click a slide to go to it. Drag a slide to change the order.</span><span class="grow"></span>
    <button class="pending" id="ordercancel">Cancel</button><button class="primary pending" id="ordersave">Save order</button></div>
  <iframe id="stripframe" data-role="strip" title="All slides"></iframe>
</section>
<script>
// On a website, "/presenter" must end in "/" so the relative links below work.
if (!/^\/(present|audience)\//.test(location.pathname) && !/(\/|\.html)$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search);
const $ = id => document.getElementById(id);
const current = $('current'), preview = $('preview'), notesBox = $('notes');
// LOCAL: run by the Lectern app (bin/lectern.js), which can save notes.md.
// Otherwise this page sits in a "presenter/" folder inside the deck's own website (for example on Vercel).
const LOCAL = location.pathname.startsWith('/present/');
const deck = LOCAL ? decodeURIComponent(location.pathname.split('/')[2] || '') : location.pathname.replace(/presenter\/.*$/, '');
const api = what => `/api/${what}/${encodeURIComponent(deck)}`;
const deckUrl = LOCAL ? `/deck/${encodeURIComponent(deck)}/` : new URL('../', location.href).pathname;
if (!LOCAL) $('home').hidden = true;
const bus = new BroadcastChannel('lectern:' + deck);
const toFrame = (f, m) => f.contentWindow && f.contentWindow.postMessage({ lectern: true, ...m }, location.origin);
const BLANK_KEYS = ['b', 'B', '.'];
const NAV_KEYS = ['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp',' ','Enter','Backspace','Home','End'];

let index = 0, steps = 0, count = 0, deckNotes = [], labels = [], title = '', fileNotes = {};
let black = false, audienceIndex = null, audienceSteps = 0, previewReady = false, restore = null, outlineSent = '';

// ---------- one place where every action happens ----------
function act(m) {
  if (m.type === 'key' && BLANK_KEYS.includes(m.key)) { setBlack(!black); return; }
  if (m.type === 'key') { toFrame(current, m); startTimer(); }
  if (m.type === 'click' && m.from !== 'current') toFrame(current, m);
  if (m.type === 'media' && m.from !== 'current') toFrame(current, m);
  if (m.type === 'hello') { bus.postMessage({ type: 'goto', index, steps }); bus.postMessage({ type: 'black', on: black }); }
  if (m.type === 'audience-state') { audienceIndex = m.index; audienceSteps = m.steps; showStatus(); }
}
// Run an action here and tell the audience window.
const send = m => { act(m); bus.postMessage(m); };
bus.onmessage = e => act(e.data);

function setBlack(on) {
  black = on;
  document.body.classList.toggle('black', on);
  bus.postMessage({ type: 'black', on });
}

// ---------- messages from the deck copies ----------
addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.lectern) return;
  if (e.source === current.contentWindow) {
    if (m.type === 'key') send({ type: 'key', key: m.key });
    if (m.type === 'click') send({ type: 'click', path: m.path, from: 'current' });
    if (m.type === 'media') send({ type: 'media', path: m.path, state: m.state, time: m.time, from: 'current' });
    if (m.type === 'ready' && restore) { toFrame(current, { type: 'goto', ...restore }); restore = null; return; }
    if (m.type === 'state') onState(m);
    // The presenter leads: when it (re)loads, an open audience window follows it.
    if (m.type === 'ready') bus.postMessage({ type: 'goto', index, steps });
  } else if (e.source === preview.contentWindow && m.type === 'ready') {
    previewReady = true; previewIndex = -1; updatePreview();
  }
});

function onState(s) {
  if (restore) return; // the deck is reloading; keep the old position until it is back
  const moved = s.index !== index || s.count !== count;
  index = s.index; steps = s.steps; count = s.count;
  if (s.labels) { deckNotes = s.notes; labels = s.labels; } // sent only when they change
  if (s.title) { title = s.title; $('title').textContent = title; document.title = 'Presenter · ' + title; }
  $('count').textContent = `${index + 1} / ${count}`;
  if (moved || document.activeElement !== notesBox) showNotes();
  if (moved) updatePreview();
  showStatus();
  sendOutline();
  if (moved && strip.src) toFrame(strip, { type: 'here', index });
}

// Keep notes.md listing every slide with its title, so an agent can see which note goes where.
function sendOutline() {
  if (!LOCAL) return;
  const key = JSON.stringify(labels);
  if (key === outlineSent || !labels.length) return;
  outlineSent = key;
  fetch(api('notes'), { method: 'PUT', body: JSON.stringify({ outline: labels, title }) });
}

// Wait a moment after each slide change, so the slide on screen gets the computer's attention first.
let previewIndex = -1, previewTimer = null;
function updatePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    if (!previewReady || previewIndex === index + 1) return;
    previewIndex = index + 1;
    $('end').classList.toggle('on', previewIndex >= count);
    if (previewIndex < count) toFrame(preview, { type: 'goto', index: previewIndex });
  }, 0);
}

function showStatus() {
  const st = $('status'), off = audienceIndex !== null && (audienceIndex !== index || audienceSteps !== steps);
  st.className = off ? 'warn' : '';
  st.textContent = audienceIndex === null ? 'Audience window not open'
    : off ? `Audience is on slide ${audienceIndex + 1}` + (audienceIndex === index ? ' (different step)' : '') : 'Audience in sync';
  $('resync').classList.toggle('on', off);
}
$('resync').onclick = () => bus.postMessage({ type: 'goto', index, steps });

// ---------- notes ----------
// A note in notes.md wins. Otherwise show the note written in the deck itself.
function showNotes() {
  notesBox.value = fileNotes[index + 1] || deckNotes[index] || '';
}
let saveTimer = null;
notesBox.addEventListener('input', () => {
  const slide = index + 1, text = notesBox.value;
  fileNotes[slide] = text;
  $('saved').textContent = '· saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!LOCAL) { // a website cannot save files, so typed notes stay in this browser
      try { localStorage.setItem('lectern-notes:' + deck, JSON.stringify(fileNotes)); $('saved').textContent = '· saved on this computer'; }
      catch { $('saved').textContent = '· could not save'; }
      return;
    }
    fetch(api('notes'), { method: 'PUT', body: JSON.stringify({ slide, text }) })
      .then(r => { $('saved').textContent = r.ok ? '· saved to notes.md' : '· could not save'; })
      .catch(() => { $('saved').textContent = '· could not save'; });
  }, 600);
});
const loadNotes = () => (LOCAL ? fetch(api('notes')).then(r => r.json())
  : Promise.resolve().then(() => ({ notes: JSON.parse(localStorage.getItem('lectern-notes:' + deck) || '{}') })).catch(() => ({}))
).then(d => {
  fileNotes = d.notes || {};
  if (document.activeElement !== notesBox) showNotes();
});

let fontSize = 26;
try { fontSize = Number(localStorage.getItem('lectern-notes-size')) || 26; } catch {}
function setFont(px) {
  fontSize = Math.max(14, Math.min(72, px));
  notesBox.style.fontSize = fontSize + 'px';
  try { localStorage.setItem('lectern-notes-size', fontSize); } catch {}
}
$('smaller').onclick = () => setFont(fontSize - 2);
$('bigger').onclick = () => setFont(fontSize + 2);
setFont(fontSize);

// ---------- live updates when an agent edits the deck or notes.md ----------
let version = null;
if (LOCAL) setInterval(() => {
  fetch(api('version')).then(r => r.json()).then(v => {
    if (version && v.slides !== version.slides) reloadDeck();
    if (version && v.notes !== version.notes && document.activeElement !== notesBox) loadNotes();
    version = v;
  }).catch(() => {});
}, 2000);
function reloadDeck() {
  restore = { index, steps };
  outlineSent = '';
  previewReady = false;
  current.src = current.src; preview.src = preview.src;
  if (strip.src) strip.src = strip.src;
  bus.postMessage({ type: 'reload' });
}

// ---------- timer and clock ----------
let elapsed = 0, startedAt = null;
function startTimer() { if (startedAt === null && elapsed === 0) startedAt = Date.now(); }
// Show the time with rolling digits. Only digits that changed move.
function setTimer(text) {
  const el = $('timer');
  if (el.dataset.text === text) return;
  const old = el.dataset.text || '';
  el.dataset.text = text;
  if (old.length !== text.length) { // a new layout (for example 9:59 -> 10:00): build it fresh
    el.replaceChildren(...[...text].map(ch => { const slot = document.createElement('span'); slot.className = 'slot'; const d = document.createElement('span'); d.className = 'd'; d.textContent = ch; slot.append(d); return slot; }));
    return;
  }
  [...text].forEach((ch, i) => {
    if (ch === old[i]) return;
    const slot = el.children[i], prev = slot.querySelector('.d:not(.leave)');
    const d = document.createElement('span'); d.className = 'd enter'; d.textContent = ch;
    slot.append(d);
    if (prev) { prev.classList.add('leave'); setTimeout(() => prev.remove(), 450); }
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.remove('enter')));
  });
}
setTimer('0:00');
$('timer').onclick = () => {
  if (startedAt === null) startedAt = Date.now();
  else { elapsed += Date.now() - startedAt; startedAt = null; }
};
$('timer').ondblclick = () => { elapsed = 0; startedAt = null; };
setInterval(() => {
  const ms = elapsed + (startedAt ? Date.now() - startedAt : 0), s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  setTimer(h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`);
  $('timer').classList.toggle('paused', !startedAt);
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}, 250);

// ---------- keys (keyboard and USB clickers) ----------
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = document.activeElement === notesBox;
  if (typing && e.key === 'Escape') { notesBox.blur(); return; }
  // Clickers send PageDown/PageUp. Those move slides even while you type notes.
  if (typing && e.key !== 'PageDown' && e.key !== 'PageUp') return;
  if (e.key === '+' || e.key === '=') return setFont(fontSize + 2);
  if (e.key === '-' || e.key === '_') return setFont(fontSize - 2);
  if (NAV_KEYS.includes(e.key) || BLANK_KEYS.includes(e.key)) { e.preventDefault(); send({ type: 'key', key: e.key }); }
});
$('next').onclick = () => send({ type: 'key', key: 'ArrowRight' });
$('prev').onclick = () => send({ type: 'key', key: 'ArrowLeft' });
// ---------- one click: presenter full screen on the Mac, slides on the TV ----------
// Chrome can see every screen (after the person allows "window management" once). Safari cannot,
// so there the button opens the slides in a window to drag to the TV.
const audienceUrl = LOCAL ? '/audience/' + encodeURIComponent(deck) : 'audience.html';
const audienceName = 'lectern-audience-' + deck;
let screenInfo = null;
async function loadScreens(ask) {
  if (!('getScreenDetails' in window)) return;
  try {
    if (!ask) {
      const p = await navigator.permissions.query({ name: 'window-management' });
      if (p.state !== 'granted') return;
    }
    screenInfo = await window.getScreenDetails();
  } catch { screenInfo = null; }
}
loadScreens(false);

let askedForScreens = false;
$('open').onclick = () => {
  // A second screen is plugged in but Chrome has not been allowed to see it yet: ask once.
  // Asking uses up this click (Chrome only opens windows straight after a click), so she clicks again.
  if (!screenInfo && screen.isExtended && 'getScreenDetails' in window && !askedForScreens) {
    askedForScreens = true;
    $('status').textContent = 'Allow Chrome to use your screens, then click Start presenting again.';
    loadScreens(true).then(() => { $('status').textContent = 'Ready. Click Start presenting again.'; });
    return;
  }
  const all = screenInfo ? screenInfo.screens : [];
  const mac = all.find(s => s.isInternal) || (screenInfo && screenInfo.currentScreen);
  const tv = all.find(s => s !== mac);
  if (!tv) { window.open(audienceUrl, audienceName, 'popup,width=1280,height=720'); return; }
  // Full screen here first. Chrome then lets the same click open the slides on the other screen.
  document.documentElement.requestFullscreen({ screen: mac }).catch(() => {});
  window.open(audienceUrl, audienceName,
    `popup,fullscreen,left=${tv.availLeft},top=${tv.availTop},width=${tv.availWidth},height=${tv.availHeight}`);
};

// ---------- scale each 1920x1080 deck view to its box ----------
const fitObserver = new ResizeObserver(entries => entries.forEach(e => {
  const r = e.contentRect;
  e.target.style.setProperty('--fit', Math.min(r.width / 1920, r.height / 1080));
}));
document.querySelectorAll('.screen').forEach(el => fitObserver.observe(el));


// ---------- slide strip ----------
const strip = $('stripframe');
let pendingOrder = null;
function goTo(n) {
  const m = { type: 'goto', index: n, steps: 0 };
  toFrame(current, m); bus.postMessage(m);
}
function cancelOrder() {
  if (!pendingOrder) return;
  pendingOrder = null; $('strip').classList.remove('changed');
  strip.src = strip.src; // back to the saved order
}
$('ordercancel').onclick = cancelOrder;
$('ordersave').onclick = async () => {
  const order = pendingOrder;
  const r = await fetch(api('order'), { method: 'PUT', body: JSON.stringify({ order }) });
  if (!r.ok) { alert(await r.text()); return; }
  pendingOrder = null; $('strip').classList.remove('changed');
  // Stay on the same slide, at its new place.
  index = order.indexOf(index); steps = 0;
  fileNotes = {}; loadNotes();
  fetch(api('version')).then(r => r.json()).then(v => { version = v; });
  reloadDeck();
};
addEventListener('message', e => {
  const m = e.data;
  if (e.source !== strip.contentWindow || !m || !m.lectern) return;
  if (m.type === 'ready') toFrame(strip, { type: 'here', index });
  if (m.type === 'strip-jump' && !pendingOrder) goTo(m.index);
  if (m.type === 'strip-order') {
    pendingOrder = m.order.every((old, pos) => old === pos) ? null : m.order;
    $('strip').classList.toggle('changed', !!pendingOrder);
  }
});
if (!LOCAL) $('striphint').textContent = 'Click a slide to go to it.'; // a website cannot save a new order

// ---------- start ----------
// On a website there is no server to add the adapter to the deck, so add it here (same website, so this is allowed).
function addAdapter(frame) {
  frame.addEventListener('load', () => {
    const w = frame.contentWindow;
    if (LOCAL || !w || w.__lectern) return;
    const s = w.document.createElement('script');
    s.src = new URL('adapter.js', location.href).href;
    w.document.head.appendChild(s);
  });
}
addAdapter(current); addAdapter(preview); addAdapter(strip);
loadNotes().finally(() => { current.src = deckUrl; preview.src = deckUrl; strip.src = deckUrl; });
showStatus();
</script>
</body>
</html>
