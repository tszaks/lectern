<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectern · Presenter</title>
<style>
  /* Black, white and gray, with one orange accent. */
  :root { --bg: #ffffff; --side: #f7f7f8; --panel: #ffffff; --line: #e7e7e9; --text: #111111; --muted: #8a8a8f;
    --accent: #f26b1d; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button:hover { background: var(--side); }
  button.primary { background: #111; border-color: #111; color: #fff; font-weight: 600; }
  button.primary:hover { background: #333; }
  button:disabled, button:disabled:hover { opacity: .35; cursor: default; background: var(--panel); }
  button.primary:disabled { background: #111; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Top bar in three zones: deck on the left, timer in the exact centre, audience and Start presenting on the right. */
  header { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 24px; min-height: 60px; padding: 0 20px; }
  /* In the Mac app there is no title bar: the window buttons sit at the left of this bar. */
  .mac-app header { padding-left: 92px; }
  .zone { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .zone-right { justify-content: flex-end; }
  #home { display: grid; place-items: center; width: 28px; height: 28px; margin-left: -6px; border-radius: 8px; color: var(--muted); flex: none; }
  #home:hover { color: var(--text); background: var(--side); }
  #home[hidden], body.presenting #home { display: none; } /* no way off the page by accident during a show */
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 1000; background: rgba(17,17,17,.88); color: #fff; font: 600 14px/1 -apple-system, system-ui, sans-serif; padding: 11px 16px; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  #home svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .zone-center { position: relative; } /* the timer is centred; the clock hangs to its right */
  #open { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 7px 16px 7px 14px; }
  #open svg { width: 11px; height: 11px; fill: currentColor; }
  @media (max-width: 960px) { #clock, #status { display: none; } }
  /* Start presenting asks how: presenter view (slides on the TV) or full screen (slides fill this screen). */
  #startmenu { position: fixed; top: 54px; right: 20px; z-index: 50; width: 320px; padding: 6px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.14); }
  #startmenu[hidden], #fullview[hidden] { display: none; }
  #startmenu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 10px 12px; background: none; }
  #startmenu button:hover, #startmenu button:focus-visible { background: var(--side); outline: none; }
  #startmenu b { display: block; font-weight: 600; margin-bottom: 2px; }
  #startmenu span { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
  #fullview { position: fixed; inset: 0; z-index: 100; background: #000; }
  #fullview iframe { width: 100%; height: 100%; border: 0; }
  /* SF Pro Rounded, Heavy: the same font Vero and Payday use for balances. */
  #timer { font: 800 24px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.01em; cursor: pointer; text-align: center; color: var(--accent); }
  #timer.paused { color: var(--muted); }
  /* Rolling digits, like Apple's number animation in Vero and Payday: a changed digit slides up and out,
     and the new one rolls in from below. */
  #timer .slot { display: inline-block; position: relative; overflow: hidden; vertical-align: top; height: 1.25em; line-height: 1.25em; }
  #timer .d { display: inline-block; transition: transform .42s cubic-bezier(.2, .9, .25, 1), opacity .3s ease, filter .3s ease; }
  #timer .d.enter { transform: translateY(70%); opacity: 0; filter: blur(2px); }
  #timer .d.leave { position: absolute; left: 0; top: 0; transform: translateY(-70%); opacity: 0; filter: blur(2px); }
  @media (prefers-reduced-motion: reduce) { #timer .d { transition: none; } }
  #clock { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 12px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; border-left: 1px solid var(--line); line-height: 1.6; }
  /* Audience status: a small dot and a few words. Gray ring = not open, dark = in sync, orange = needs a fix. */
  #status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #status::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #c4c4c8; }
  #status.sync::before { box-shadow: none; background: #111; }
  #status.warn { color: var(--accent); }
  #status.warn::before { box-shadow: none; background: var(--accent); }
  @media (max-width: 960px) { #status { display: none; } } /* narrow window: give the title the room */
  #resync { display: none; padding: 2px 10px; font-size: 13px; }
  #resync.on { display: inline-block; }
  #blackbadge { display: none; flex: none; background: #111; color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  body.black #blackbadge { display: inline-block; }

  /* Everything scales with the window, in both directions: each slide is the biggest 16:9 box that fits. */
  /* Two modes. Project (default): slide thumbnails on the left, the slide large, notes underneath.
     Presenting (after Present > Presenter view): Now, Next, notes and the timer. */
  main { display: grid; gap: clamp(12px, 2vw, 24px); padding: 8px clamp(12px, 1.5vw, 20px) clamp(12px, 1.5vw, 20px); min-height: 0; overflow: hidden; }
  body:not(.presenting) main { grid-template-columns: clamp(150px, 15vw, 220px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(110px, 26%);
    grid-template-areas: "strip now" "strip notes"; }
  body.presenting main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); grid-template-rows: minmax(0, .85fr) minmax(0, 1.15fr);
    grid-template-areas: "now next" "now notes"; }
  #strip { grid-area: strip; } .nowbox { grid-area: now; } .nextbox { grid-area: next; } .notesbox { grid-area: notes; }
  /* Hidden boxes stay laid out (off screen, invisible) instead of display:none. A deck inside a
     display:none box measures itself as 0 wide and draws nothing when it comes back (Next was black). */
  body:not(.presenting) .nextbox, body.presenting #strip { position: fixed; left: -10000px; top: 0; width: 480px; height: 300px; visibility: hidden; }
  .stage { width: 100%; }
  .nowbox { container-type: size; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  .nowbox .stage { width: min(100cqw, calc((100cqh - 62px) * 16 / 9)); }
  body.presenting .nowbox .stage { width: min(100cqw, calc((100cqh - 96px) * 16 / 9)); }
  body:not(.presenting) .nowbox .label { display: none; }
  .nextbox { container-type: size; display: flex; justify-content: center; min-height: 0; }
  .nextbox .stage { width: min(100cqw, calc((100cqh - 26px) * 16 / 9)); }
  .notesbox { display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 760px) { body.presenting main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "now" "notes"; } body.presenting .nextbox { position: fixed; left: -10000px; width: 480px; height: 300px; visibility: hidden; } }
  .label { color: var(--muted); font-size: 12px; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .screen { position: relative; aspect-ratio: 16 / 9; width: 100%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  /* Decks always render at 1920x1080 and are scaled to fit, so every view matches the projector. */
  .screen iframe { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0;
    transform: translate(-50%, -50%) scale(var(--fit, .25)); will-change: transform; }
  /* "Next" is a frozen copy of the deck: it looks exactly like the slide, with no animation. */
  #preview { pointer-events: none; }
  #end { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); background: var(--side); }
  #end.on { display: grid; }
  #nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
  #count { font-variant-numeric: tabular-nums; min-width: 90px; text-align: center; color: var(--muted); }
  #notes { flex: 1; width: 100%; resize: none; background: var(--side); color: var(--text); border: 1px solid transparent; border-radius: 12px;
    padding: 16px 18px; font: 26px/1.45 -apple-system, system-ui, sans-serif; outline: none; }
  #notes:focus { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
  #notes::placeholder { color: #b4b4b8; }
  .size { display: flex; gap: 6px; align-items: center; }
  .size button { padding: 2px 10px; font-size: 13px; }
  #saved { font-size: 12px; }

  /* Slide thumbnails down the left, like Keynote: click to go to a slide, drag to change the order. */
  #strip { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-radius: 12px; overflow: hidden; }
  #strip .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px 4px; color: var(--muted); font-size: 12px; font-weight: 500; }
  #strip .bar .grow { flex: 1; }
  #strip .bar button { padding: 3px 10px; font-size: 12px; }
  #strip .bar .pending { display: none; }
  #strip.changed .bar .pending { display: inline-block; }
  #stripframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; }
  /* Top bar per mode: Present in the project; timer, audience status and End while presenting. */
  body:not(.presenting) #timer, body:not(.presenting) #clock, body:not(.presenting) #status,
  body:not(.presenting) #resync, body:not(.presenting) #blackbadge, body:not(.presenting) #endbtn,
  body.presenting #open { display: none !important; }
  #endbtn { flex: none; }
  #exportbtn { display: inline-flex; align-items: center; gap: 7px; flex: none; }
  #exportbtn[hidden], body.presenting #exportbtn { display: none !important; }
  #exportbtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* A new, empty project: import slides first. */
  #emptystate { display: none; }
  body.empty-project main { display: none; }
  body.empty-project #emptystate { display: grid; place-items: center; min-height: 0; padding: 24px; }
  #emptystate .box { width: min(560px, 100%); text-align: center; padding: 44px 32px; border: 2px dashed var(--line); border-radius: 18px; transition: border-color .2s, background .2s; }
  body.over #emptystate .box { border-color: var(--accent); background: rgba(242,107,29,.04); }
  #emptystate h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; }
  #emptystate p { margin: 0 0 22px; color: var(--muted); }
  #emptystate .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #emptystate small { display: block; margin-top: 18px; color: var(--muted); font-size: 12px; }
  body.empty-project #open { opacity: .35; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="zone zone-left">
    <a id="home" href="/" title="All decks" aria-label="All decks"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div id="title">Lectern</div>
  </div>
  <div class="zone zone-center">
    <span id="timer" class="paused" title="Click to start or pause. Double-click to reset.">0:00</span>
    <span id="clock"></span>
  </div>
  <div class="zone zone-right">
    <span id="blackbadge">Screen blank</span>
    <span id="status"></span><button id="resync">Fix</button>
    <button id="exportbtn" title="Save this project as one .lectern file to send to someone" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Export</button>
    <button class="primary" id="open"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6c0 .5.5.8.9.5l7.4-4.8c.4-.3.4-.8 0-1L3.4.7c-.4-.3-.9 0-.9.5z"/></svg>Present</button>
    <button id="endbtn" title="End the presentation (Esc)">End</button>
  </div>
</header>
<div id="startmenu" role="menu" hidden>
  <button role="menuitem" data-mode="presenter"><b>Presenter view</b><span id="pvnote">Slides on the TV or projector. Your notes and the timer stay on this screen.</span></button>
  <button role="menuitem" data-mode="full"><b>Full screen</b><span>Slides fill this screen. Press Esc to stop.</span></button>
</div>
<div id="fullview" hidden><iframe id="fsframe" title="Slides" allow="fullscreen; autoplay"></iframe></div>
<section id="emptystate">
  <div class="box">
    <h2>This project is empty</h2>
    <p>Import the slides to present. You can also drag files onto this window.</p>
    <div class="choices">
      <button class="primary" id="impfolder">Import a deck folder…</button>
      <button id="impfile">Import an HTML file…</button>
      <button id="impimages">Import slide images…</button>
    </div>
    <small id="impbusy">For an HTML deck, choose its whole folder so its images and fonts come along.</small>
  </div>
  <input id="pickfolder" type="file" webkitdirectory hidden>
  <input id="pickfile" type="file" accept=".html,.htm" hidden>
  <input id="pickimages" type="file" accept="image/*" multiple hidden>
</section>
<main>
  <section id="strip" aria-label="Slides">
    <div class="bar"><span id="striphint">Slides</span><span class="grow"></span>
      <button class="pending" id="ordercancel">Cancel</button><button class="primary pending" id="ordersave">Save order</button></div>
    <iframe id="stripframe" data-role="strip" title="All slides"></iframe>
  </section>
  <section class="nowbox">
    <div class="stage">
      <div class="label">Now</div>
      <div class="screen"><iframe id="current" data-role="current" allow="fullscreen; autoplay"></iframe></div>
    </div>
    <div id="nav">
      <button id="prev" aria-label="Previous">←</button>
      <span id="count">–</span>
      <button id="next" aria-label="Next">→</button>
    </div>
  </section>
  <section class="nextbox"><div class="stage">
    <div class="label">Next</div>
    <div class="screen"><iframe id="preview" data-role="preview" tabindex="-1"></iframe><div id="end">End of deck</div></div>
  </div></section>
  <section class="notesbox">
    <div class="label">
      <span>Notes <span id="saved"></span></span>
      <span class="size"><button id="smaller" title="Smaller notes (−)">A−</button><button id="bigger" title="Bigger notes (+)">A+</button></span>
    </div>
    <textarea id="notes" placeholder="No notes for this slide. Type here, or ask your agent to add them." spellcheck="true"></textarea>
  </section>
</main>
<script>
// On a website, "/presenter" must end in "/" so the relative links below work.
if (!/^\/(present|audience)\//.test(location.pathname) && !/(\/|\.html)$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search);
const $ = id => document.getElementById(id);
const current = $('current'), preview = $('preview'), notesBox = $('notes');
// LOCAL: run by the Lectern app (bin/lectern.js), which can save notes.md.
// Otherwise this page sits in a "presenter/" folder inside the deck's own website (for example on Vercel).
const LOCAL = location.pathname.startsWith('/present/');
const deck = LOCAL ? decodeURIComponent(location.pathname.split('/')[2] || '') : location.pathname.replace(/presenter\/.*$/, '');
const api = what => `/api/${what}/${encodeURIComponent(deck)}`;
const deckUrl = LOCAL ? `/deck/${encodeURIComponent(deck)}/` : new URL('../', location.href).pathname;
if (!LOCAL) $('home').hidden = true;
const bus = new BroadcastChannel('lectern:' + deck);
const toFrame = (f, m) => f.contentWindow && f.contentWindow.postMessage({ lectern: true, ...m }, location.origin);
const BLANK_KEYS = ['b', 'B', '.'];
const NAV_KEYS = ['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp',' ','Enter','Backspace','Home','End'];

let index = 0, steps = 0, count = 0, deckNotes = [], labels = [], title = '', fileNotes = {};
let black = false, audienceIndex = null, audienceSteps = 0, previewReady = false, restore = null, outlineSent = '';

// ---------- one place where every action happens ----------
function act(m) {
  if (m.type === 'key' && BLANK_KEYS.includes(m.key)) { setBlack(!black); return; }
  if (m.type === 'key') { toFrame(current, m); if (document.body.classList.contains('presenting')) startTimer(); }
  if (m.type === 'click' && m.from !== 'current') toFrame(current, m);
  if (m.type === 'media' && m.from !== 'current') toFrame(current, m);
  if (m.type === 'hello') { bus.postMessage({ type: 'goto', index, steps }); bus.postMessage({ type: 'black', on: black }); }
  if (m.type === 'audience-state') { audienceIndex = m.index; audienceSteps = m.steps; showStatus(); }
  if (m.type === 'audience-gone') { audienceIndex = null; showStatus(); }
}
// Run an action here and tell the audience window.
const send = m => { act(m); bus.postMessage(m); };
bus.onmessage = e => act(e.data);

function setBlack(on) {
  black = on;
  document.body.classList.toggle('black', on);
  bus.postMessage({ type: 'black', on });
}

// ---------- messages from the deck copies ----------
addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.lectern) return;
  if (e.source === current.contentWindow) {
    if (m.type === 'key') send({ type: 'key', key: m.key });
    if (m.type === 'click') send({ type: 'click', path: m.path, from: 'current' });
    if (m.type === 'media') send({ type: 'media', path: m.path, state: m.state, time: m.time, from: 'current' });
    if (m.type === 'ready' && restore) { toFrame(current, { type: 'goto', ...restore }); restore = null; return; }
    if (m.type === 'state') onState(m);
    // The presenter leads: when it (re)loads, an open audience window follows it.
    if (m.type === 'ready') bus.postMessage({ type: 'goto', index, steps });
  } else if (e.source === preview.contentWindow && m.type === 'ready') {
    previewReady = true; previewIndex = -1; updatePreview();
  }
});

function onState(s) {
  if (restore) return; // the deck is reloading; keep the old position until it is back
  const moved = s.index !== index || s.count !== count;
  index = s.index; steps = s.steps; count = s.count;
  if (s.labels) { deckNotes = s.notes; labels = s.labels; } // sent only when they change
  if (s.title) { title = s.title; $('title').textContent = title; document.title = 'Presenter · ' + title; }
  $('count').textContent = `${index + 1} / ${count}`;
  if (moved || document.activeElement !== notesBox) showNotes();
  if (moved) updatePreview();
  showStatus();
  sendOutline();
  if (moved && strip.src) toFrame(strip, { type: 'here', index });
}

// Keep notes.md listing every slide with its title, so an agent can see which note goes where.
function sendOutline() {
  if (!LOCAL) return;
  const key = JSON.stringify(labels);
  if (key === outlineSent || !labels.length) return;
  outlineSent = key;
  fetch(api('notes'), { method: 'PUT', body: JSON.stringify({ outline: labels, title }) });
}

// Wait a moment after each slide change, so the slide on screen gets the computer's attention first.
let previewIndex = -1, previewTimer = null;
function updatePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    if (!previewReady || previewIndex === index + 1) return;
    previewIndex = index + 1;
    $('end').classList.toggle('on', previewIndex >= count);
    if (previewIndex < count) toFrame(preview, { type: 'goto', index: previewIndex });
  }, 0);
}

function showStatus() {
  const st = $('status'), off = audienceIndex !== null && (audienceIndex !== index || audienceSteps !== steps);
  st.className = audienceIndex === null ? '' : off ? 'warn' : 'sync';
  st.textContent = audienceIndex === null ? 'Audience not open'
    : off ? `Audience on slide ${audienceIndex + 1}` + (audienceIndex === index ? ', other step' : '') : 'Audience in sync';
  $('resync').classList.toggle('on', off);
}
$('resync').onclick = () => bus.postMessage({ type: 'goto', index, steps });

// ---------- notes ----------
// A note in notes.md wins. Otherwise show the note written in the deck itself.
function showNotes() {
  notesBox.value = fileNotes[index + 1] || deckNotes[index] || '';
}
let saveTimer = null;
notesBox.addEventListener('input', () => {
  const slide = index + 1, text = notesBox.value;
  fileNotes[slide] = text;
  $('saved').textContent = '· saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!LOCAL) { // a website cannot save files, so typed notes stay in this browser
      try { localStorage.setItem('lectern-notes:' + deck, JSON.stringify(fileNotes)); $('saved').textContent = '· saved on this computer'; }
      catch { $('saved').textContent = '· could not save'; }
      return;
    }
    fetch(api('notes'), { method: 'PUT', body: JSON.stringify({ slide, text }) })
      .then(r => { $('saved').textContent = r.ok ? '· saved to notes.md' : '· could not save'; })
      .catch(() => { $('saved').textContent = '· could not save'; });
  }, 600);
});
const loadNotes = () => (LOCAL ? fetch(api('notes')).then(r => r.json())
  : Promise.resolve().then(() => ({ notes: JSON.parse(localStorage.getItem('lectern-notes:' + deck) || '{}') })).catch(() => ({}))
).then(d => {
  fileNotes = d.notes || {};
  if (document.activeElement !== notesBox) showNotes();
});

let fontSize = 26;
try { fontSize = Number(localStorage.getItem('lectern-notes-size')) || 26; } catch {}
function setFont(px) {
  fontSize = Math.max(14, Math.min(72, px));
  notesBox.style.fontSize = fontSize + 'px';
  try { localStorage.setItem('lectern-notes-size', fontSize); } catch {}
}
$('smaller').onclick = () => setFont(fontSize - 2);
$('bigger').onclick = () => setFont(fontSize + 2);
setFont(fontSize);

// ---------- live updates when an agent edits the deck or notes.md ----------
let version = null;
if (LOCAL) setInterval(() => {
  fetch(api('version')).then(r => r.json()).then(v => {
    if (version && v.slides !== version.slides) reloadDeck();
    if (version && v.notes !== version.notes && document.activeElement !== notesBox) loadNotes();
    version = v;
  }).catch(() => {});
}, 2000);
function reloadDeck() {
  restore = { index, steps };
  outlineSent = '';
  previewReady = false;
  current.src = current.src; preview.src = preview.src;
  if (strip.src) strip.src = strip.src;
  bus.postMessage({ type: 'reload' });
}

// ---------- timer and clock ----------
let elapsed = 0, startedAt = null;
function startTimer() { if (startedAt === null && elapsed === 0) startedAt = Date.now(); }
// Show the time with rolling digits. Only digits that changed move.
function setTimer(text) {
  const el = $('timer');
  if (el.dataset.text === text) return;
  const old = el.dataset.text || '';
  el.dataset.text = text;
  if (old.length !== text.length) { // a new layout (for example 9:59 -> 10:00): build it fresh
    el.replaceChildren(...[...text].map(ch => { const slot = document.createElement('span'); slot.className = 'slot'; const d = document.createElement('span'); d.className = 'd'; d.textContent = ch; slot.append(d); return slot; }));
    return;
  }
  [...text].forEach((ch, i) => {
    if (ch === old[i]) return;
    const slot = el.children[i], prev = slot.querySelector('.d:not(.leave)');
    const d = document.createElement('span'); d.className = 'd enter'; d.textContent = ch;
    slot.append(d);
    if (prev) { prev.classList.add('leave'); setTimeout(() => prev.remove(), 450); }
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.remove('enter')));
  });
}
setTimer('0:00');
$('timer').onclick = () => {
  if (startedAt === null) startedAt = Date.now();
  else { elapsed += Date.now() - startedAt; startedAt = null; }
};
$('timer').ondblclick = () => { elapsed = 0; startedAt = null; };
setInterval(() => {
  const ms = elapsed + (startedAt ? Date.now() - startedAt : 0), s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  setTimer(h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`);
  $('timer').classList.toggle('paused', !startedAt);
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}, 250);

// ---------- keys (keyboard and USB clickers) ----------
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && !$('fullview').hidden) { confirmEnd(leaveFullScreen); return; }
  if (e.key === 'Escape' && document.body.classList.contains('presenting')) { confirmEnd(endPresenting); return; }
  const typing = document.activeElement === notesBox && !notesBox.readOnly;
  if (typing && e.key === 'Escape') { notesBox.blur(); return; }
  // Clickers send PageDown/PageUp. Those move slides even while you type notes.
  if (typing && e.key !== 'PageDown' && e.key !== 'PageUp') return;
  if (e.key === '+' || e.key === '=') return setFont(fontSize + 2);
  if (e.key === '-' || e.key === '_') return setFont(fontSize - 2);
  if (NAV_KEYS.includes(e.key) || BLANK_KEYS.includes(e.key)) { e.preventDefault(); send({ type: 'key', key: e.key }); }
});
$('next').onclick = () => send({ type: 'key', key: 'ArrowRight' });
$('prev').onclick = () => send({ type: 'key', key: 'ArrowLeft' });
// ---------- one click: presenter full screen on the Mac, slides on the TV ----------
// Chrome can see every screen (after the person allows "window management" once). Safari cannot,
// so there the button opens the slides in a window to drag to the TV.
const audienceUrl = LOCAL ? '/audience/' + encodeURIComponent(deck) : 'audience.html';
const audienceName = 'lectern-audience-' + deck;
let screenInfo = null;
async function loadScreens(ask) {
  if (!('getScreenDetails' in window)) return;
  try {
    if (!ask) {
      const p = await navigator.permissions.query({ name: 'window-management' });
      if (p.state !== 'granted') return;
    }
    screenInfo = await window.getScreenDetails();
  } catch { screenInfo = null; }
}
loadScreens(false);

let askedForScreens = false;
const menu = $('startmenu');
function showMenu(on) {
  menu.hidden = !on;
  if (!on) return;
  // Say what "Presenter view" will do on this computer right now.
  const known = screenInfo || typeof screen.isExtended === 'boolean';
  const two = (screenInfo && screenInfo.screens.length > 1) || screen.isExtended === true;
  $('pvnote').textContent = !known ? 'Slides go to the TV or projector. Your notes and the timer stay on this screen.'
    : two ? 'Slides go to the TV or projector. Your notes and the timer stay on this screen.'
    : 'No second screen found, so the slides open in their own window. Plug in a TV to put them there.';
  menu.querySelector('button').focus();
}
$('open').onclick = e => { e.stopPropagation(); showMenu(menu.hidden); };
addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) showMenu(false); });
// A click on a slide goes into the slide's own page, not this one; this page then loses focus.
addEventListener('blur', () => { if (!menu.hidden) showMenu(false); });
menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); }
  if (e.key === 'Escape') { showMenu(false); $('open').focus(); }
  e.stopPropagation(); // arrow keys here pick a menu item, not a slide
});
menu.querySelectorAll('button').forEach(b => b.onclick = () => beginPresenting(b.dataset.mode));

// Starting either way also starts the timer from 0:00.
// Tell the Mac app when a show starts and ends, so it keeps the Mac awake in between.
const macWindow = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lecternWindow;
function beginPresenting(mode) {
  showMenu(false);
  if (macWindow) macWindow.postMessage('presentingStart');
  elapsed = 0; startedAt = Date.now();
  if (mode === 'full') { enterFullScreen(); return; }
  document.body.classList.add('presenting'); // switch to Now / Next / notes / timer
  notesBox.readOnly = true; // during the show, a click in the notes must not turn clicker keys into typing
  previewIndex = -1; updatePreview();
  presenterView();
}
// End: close the slides window, stop the timer, and go back to the project.
function endPresenting() {
  document.body.classList.remove('presenting');
  notesBox.readOnly = false;
  bus.postMessage({ type: 'end' });
  elapsed = 0; startedAt = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const mac = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lecternWindow;
  if (mac) mac.postMessage('endPresenting'); // the Mac app also leaves full screen
  $('open').focus();
}
$('endbtn').onclick = endPresenting;

// Full screen: the slides cover this whole screen, above the presenter view, and stay in sync with it.
function enterFullScreen() {
  const fv = $('fullview'), f = $('fsframe');
  f.onload = () => f.contentWindow && f.contentWindow.focus(); // keys and the clicker go to the slides
  f.src = audienceUrl;
  fv.hidden = false;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
function leaveFullScreen() {
  const fv = $('fullview');
  if (fv.hidden) return;
  fv.hidden = true;
  elapsed = 0; startedAt = null;
  if (macWindow) macWindow.postMessage('presentingEnd');
  $('fsframe').onload = null;
  $('fsframe').src = 'about:blank';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $('open').focus();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) leaveFullScreen(); });
addEventListener('message', e => { if (e.source === $('fsframe').contentWindow && e.data && e.data.lecternExit) confirmEnd(leaveFullScreen); });

// Esc ends a show only when pressed twice, so a stray key or a clicker's "slideshow" button
// (many send F5, then Esc on the next press) cannot end the talk by accident.
let escAt = 0, toastTimer = null;
const toast = document.createElement('div'); toast.id = 'toast'; document.body.append(toast);
function showToast(text) { toast.textContent = text; toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 2500); }
function confirmEnd(end) {
  if (Date.now() - escAt < 2500) { escAt = 0; toast.classList.remove('on'); end(); return; }
  escAt = Date.now(); showToast('Press Esc again to end the show');
}

function presenterView() {
  // A second screen is plugged in but Chrome has not been allowed to see it yet: ask once.
  // Asking uses up this click (Chrome only opens windows straight after a click), so she clicks again.
  if (!screenInfo && screen.isExtended && 'getScreenDetails' in window && !askedForScreens) {
    askedForScreens = true;
    $('status').textContent = 'Allow Chrome to use your screens, then click Start presenting again.';
    loadScreens(true).then(() => { $('status').textContent = 'Ready. Click Start presenting again.'; });
    return;
  }
  const all = screenInfo ? screenInfo.screens : [];
  const mac = all.find(s => s.isInternal) || (screenInfo && screenInfo.currentScreen);
  const tv = all.find(s => s !== mac);
  if (!tv) { window.open(audienceUrl, audienceName, 'popup,width=1280,height=720'); return; }
  // Full screen here first. Chrome then lets the same click open the slides on the other screen.
  document.documentElement.requestFullscreen({ screen: mac }).catch(() => {});
  window.open(audienceUrl, audienceName,
    `popup,fullscreen,left=${tv.availLeft},top=${tv.availTop},width=${tv.availWidth},height=${tv.availHeight}`);
};

// ---------- scale each 1920x1080 deck view to its box ----------
// Measure each box and set its scale. Called on window resize and whenever the layout changes
// (switching between project and presenting changes the box sizes; a resize watcher alone missed that).
function fitAll() {
  document.querySelectorAll('.screen').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width) el.style.setProperty('--fit', Math.min(r.width / 1920, r.height / 1080));
  });
}
const fitSoon = () => requestAnimationFrame(fitAll);
new ResizeObserver(fitSoon).observe(document.body);
document.querySelectorAll('.screen').forEach(el => new ResizeObserver(fitSoon).observe(el));
addEventListener('resize', fitSoon);
new MutationObserver(fitSoon).observe(document.body, { attributes: true, attributeFilter: ['class'] }); // mode switches


// ---------- slide strip ----------
const strip = $('stripframe');
let pendingOrder = null;
function goTo(n) {
  const m = { type: 'goto', index: n, steps: 0 };
  toFrame(current, m); bus.postMessage(m);
}
function cancelOrder() {
  if (!pendingOrder) return;
  pendingOrder = null; $('strip').classList.remove('changed');
  strip.src = strip.src; // back to the saved order
}
$('ordercancel').onclick = cancelOrder;
$('ordersave').onclick = async () => {
  const order = pendingOrder;
  const r = await fetch(api('order'), { method: 'PUT', body: JSON.stringify({ order }) });
  if (!r.ok) { alert(await r.text()); return; }
  pendingOrder = null; $('strip').classList.remove('changed');
  // Stay on the same slide, at its new place.
  index = order.indexOf(index); steps = 0;
  fileNotes = {}; loadNotes();
  fetch(api('version')).then(r => r.json()).then(v => { version = v; });
  reloadDeck();
};
addEventListener('message', e => {
  const m = e.data;
  if (e.source !== strip.contentWindow || !m || !m.lectern) return;
  if (m.type === 'ready') toFrame(strip, { type: 'here', index });
  if (m.type === 'strip-jump' && !pendingOrder) goTo(m.index);
  if (m.type === 'strip-order') {
    pendingOrder = m.order.every((old, pos) => old === pos) ? null : m.order;
    $('strip').classList.toggle('changed', !!pendingOrder);
  }
});

// ---------- Export (Mac app): the whole project as one .lectern file to send ----------
const macHandler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lectern;
if (macHandler && LOCAL) { $('exportbtn').hidden = false; $('exportbtn').onclick = () => macHandler.postMessage('exportProject'); }

// ---------- a new, empty project: import slides ----------
async function importIntoProject(files) {
  files = files.filter(f => f.path && !f.path.split('/').some(part => part.startsWith('.')));
  if (!files.length) return;
  $('impbusy').textContent = `Importing ${files.length} file${files.length === 1 ? '' : 's'}…`;
  for (const { file, path } of files) {
    const r = await fetch(`/api/upload/${encodeURIComponent(deck)}/${path.split('/').map(encodeURIComponent).join('/')}`, { method: 'PUT', body: file });
    if (!r.ok) { alert(`Could not import ${path}: ${await r.text()}`); return; }
  }
  location.reload();
}
const asFiles = (list, folder) => [...list].map(f => ({ file: f, path: folder ? f.webkitRelativePath.split('/').slice(1).join('/') : f.name }));
$('impfolder').onclick = () => $('pickfolder').click();
$('impfile').onclick = () => $('pickfile').click();
$('impimages').onclick = () => $('pickimages').click();
$('pickfolder').onchange = e => importIntoProject(asFiles(e.target.files, true));
$('pickfile').onchange = e => importIntoProject(asFiles(e.target.files, false));
$('pickimages').onchange = e => importIntoProject(asFiles(e.target.files, false));
function readEntry(entry, prefix = '') {
  return new Promise(resolve => {
    if (entry.isFile) return entry.file(f => resolve([{ file: f, path: prefix + f.name }]), () => resolve([]));
    const reader = entry.createReader(), all = [];
    const next = () => reader.readEntries(async batch => {
      if (!batch.length) return resolve((await Promise.all(all.map(e => readEntry(e, prefix + entry.name + '/')))).flat());
      all.push(...batch); next();
    }, () => resolve([]));
    next();
  });
}
addEventListener('dragover', e => { if (document.body.classList.contains('empty-project')) { e.preventDefault(); document.body.classList.add('over'); } });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
addEventListener('drop', async e => {
  if (!document.body.classList.contains('empty-project')) return;
  e.preventDefault(); document.body.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length === 1 && entries[0].isDirectory) { // a folder: its contents go into the project
    const folder = entries[0];
    return importIntoProject((await readEntry(folder)).map(f => ({ file: f.file, path: f.path.slice(folder.name.length + 1) })));
  }
  importIntoProject((await Promise.all(entries.map(en => readEntry(en)))).flat());
});

// ---------- start ----------
// On a website there is no server to add the adapter to the deck, so add it here (same website, so this is allowed).
function addAdapter(frame) {
  frame.addEventListener('load', () => {
    const w = frame.contentWindow;
    if (LOCAL || !w || w.__lectern) return;
    const s = w.document.createElement('script');
    s.src = new URL('adapter.js', location.href).href;
    w.document.head.appendChild(s);
  });
}
addAdapter(current); addAdapter(preview); addAdapter(strip);
// An empty project shows the import screen instead of the slides.
(LOCAL ? fetch('/api/decks').then(r => r.json()).then(d => (d.decks.find(x => x.name === deck) || {}).ok !== false) : Promise.resolve(true))
  .catch(() => true)
  .then(hasSlides => {
    if (!hasSlides) { document.body.classList.add('empty-project'); $('title').textContent = deck; document.title = deck; return; }
    loadNotes().finally(() => { current.src = deckUrl; preview.src = deckUrl; strip.src = deckUrl; });
  });
showStatus();

// After a click on an embedded player inside a slide (for example YouTube), keyboard focus would stay in that
// player and the clicker would stop changing slides. The slide asks for focus back; this invisible spot takes it.
const keySink = document.createElement('span');
keySink.tabIndex = -1; keySink.setAttribute('aria-hidden', 'true');
keySink.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
document.body.append(keySink);
addEventListener('message', e => { if (e.data && e.data.lectern && e.data.type === 'refocus') keySink.focus({ preventScroll: true }); });
// A click on an embedded player (YouTube) moves keyboard focus into that player's own frame, and a
// clicker's keys then go to the player, not the slides. Take focus back as soon as that happens.
function trappedInPlayer() {
  const a = document.activeElement;
  if (!a || a.tagName !== 'IFRAME') return false;
  try { const inner = a.contentDocument && a.contentDocument.activeElement; return !!inner && inner.tagName === 'IFRAME'; }
  catch { return true; } // a frame we cannot read is not one of ours
}
const freeFocus = () => { if (trappedInPlayer()) keySink.focus({ preventScroll: true }); };
addEventListener('blur', () => setTimeout(freeFocus, 0));
setInterval(freeFocus, 400);

</script>
</body>
</html>
