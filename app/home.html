<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectern</title>
<style>
  /* Black, white and gray, with one orange accent. */
  :root { --bg: #ffffff; --side: #f7f7f8; --line: #e7e7e9; --text: #111111; --muted: #8a8a8f; --accent: #f26b1d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
  .mac-app main { padding-top: 84px; } /* room under the window buttons; the empty top moves the window */
  button { font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; }
  button:hover { background: var(--side); }
  button.primary { background: #111; border-color: #111; color: #fff; font-weight: 600; }
  button.primary:hover { background: #333; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; flex: 1; }
  h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 10px; }

  #list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #list li { border-bottom: 1px solid var(--line); }
  #list a { display: flex; align-items: center; gap: 14px; padding: 14px 10px; margin: 0 -10px; border-radius: 10px; color: inherit; text-decoration: none; }
  #list a:hover { background: var(--side); }
  .icon { flex: none; width: 40px; height: 30px; border-radius: 6px; background: var(--side); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chev { color: #c4c4c8; font-size: 18px; line-height: 1; }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; border-bottom: 1px solid var(--line); margin: 0; }
  .where { color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* Dropping a folder or HTML file anywhere imports it as a new project. */
  #dropping { position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 16px; background: rgba(242,107,29,.04);
    display: none; place-items: center; font-weight: 600; pointer-events: none; z-index: 10; }
  body.over #dropping { display: grid; }
  #busy { color: var(--muted); font-size: 13px; margin-right: 4px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Lectern</h1>
    <span id="busy"></span>
    <button id="open" title="Open an HTML deck folder or HTML file">Open…</button>
    <button class="primary" id="new">New project</button>
  </div>
  <h2>Projects</h2>
  <ul id="list"></ul>
  <p class="empty" id="emptyhint" hidden>No projects yet. Click <b>New project</b>, or open an HTML deck.</p>
  <p class="where" id="where"></p>
</main>
<div id="dropping">Drop to import as a new project</div>
<input id="picker" type="file" webkitdirectory hidden>
<!-- Icons for the project list, copied for each row. -->
<template id="icon-html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></template>
<template id="icon-images"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 8"/></svg></template>
<template id="icon-empty"><svg viewBox="0 0 24 24"><path d="M12 8v8M8 12h8"/></svg></template>
<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
// In the Mac app, "Open…" uses the Mac's own panel and links the folder or file (nothing is copied).
const macApp = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lectern;
let names = [];

function when(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  if (d.toDateString() === now.toDateString()) return 'today, ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}

// The project list, most recently changed first. Click a project to open it.
async function refresh() {
  const { decks, library } = await fetch('/api/decks').then(r => r.json());
  names = decks.map(d => d.name);
  const list = $('list');
  list.replaceChildren();
  $('emptyhint').hidden = decks.length > 0;
  for (const d of decks) {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = '/present/' + enc(d.name);
    const icon = document.createElement('span'); icon.className = 'icon';
    icon.append(($('icon-' + d.kind) || $('icon-html')).content.cloneNode(true));
    const name = document.createElement('span'); name.className = 'name'; name.textContent = d.name;
    const meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = d.kind === 'empty' ? 'Empty' : (d.kind === 'images' ? `${d.slides} slide images` : 'HTML deck') + (d.modified ? ' · edited ' + when(d.modified) : '');
    const chev = document.createElement('span'); chev.className = 'chev'; chev.textContent = '›';
    a.append(icon, name, meta, chev); li.append(a); list.append(li);
  }
  $('where').textContent = library ? `Projects are kept in ${library}. Each one has a notes.md file that you or an agent can edit.` : '';
}

// ---------- new project: make an empty one and go inside it ----------
$('new').onclick = async () => {
  const base = 'Untitled project';
  let name = base, n = 2;
  while (names.includes(name)) name = `${base} ${n++}`;
  const r = await fetch('/api/new/' + enc(name), { method: 'POST' });
  if (!r.ok) { alert(await r.text()); return; }
  location.href = '/present/' + enc((await r.json()).name);
};

// ---------- open an existing deck ----------
$('open').onclick = () => macApp ? macApp.postMessage('addDeck') : $('picker').click();
$('picker').onchange = () => {
  const files = [...$('picker').files];
  if (!files.length) return;
  const deck = files[0].webkitRelativePath.split('/')[0];
  importAsProject(deck, files.map(f => ({ file: f, path: f.webkitRelativePath.split('/').slice(1).join('/') })));
};

// Copy files into a new project. Each file keeps its place in the folder, so images and fonts still load.
async function importAsProject(deck, files) {
  files = files.filter(f => f.path && !f.path.split('/').some(part => part.startsWith('.')));
  if (!files.length) return;
  let name = deck, n = 2;
  while (names.includes(name)) name = `${deck} ${n++}`;
  $('busy').textContent = `Importing ${name}…`;
  for (const { file, path } of files) {
    const r = await fetch(`/api/upload/${enc(name)}/${path.split('/').map(enc).join('/')}`, { method: 'PUT', body: file });
    if (!r.ok) { alert(`Could not import ${path}: ${await r.text()}`); $('busy').textContent = ''; return; }
  }
  location.href = '/present/' + enc(name);
}

// Read a dropped folder (or loose files) into { file, path } pairs.
function readEntry(entry, prefix = '') {
  return new Promise(resolve => {
    if (entry.isFile) return entry.file(f => resolve([{ file: f, path: prefix + f.name }]), () => resolve([]));
    const reader = entry.createReader(), all = [];
    const next = () => reader.readEntries(async batch => {
      if (!batch.length) return resolve((await Promise.all(all.map(e => readEntry(e, prefix + entry.name + '/')))).flat());
      all.push(...batch); next();
    }, () => resolve([]));
    next();
  });
}
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length === 1 && entries[0].isDirectory) {
    const folder = entries[0];
    const files = (await readEntry(folder)).map(f => ({ file: f.file, path: f.path.slice(folder.name.length + 1) }));
    return importAsProject(folder.name, files);
  }
  const files = (await Promise.all(entries.map(en => readEntry(en)))).flat();
  const html = files.find(f => /\.html?$/i.test(f.path));
  importAsProject(html ? html.path.replace(/\.html?$/i, '') : 'Imported slides', files);
});

refresh().then(() => { if (new URLSearchParams(location.search).has('new')) $('new').click(); }); // File > New Project in the Mac app
</script>
</body>
</html>
